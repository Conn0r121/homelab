# sops encryption rules. Replace the recipient with YOUR age public key
# (`age-keygen` prints it as "Public key: age1...") before creating secrets.
# One key for now; per-host keys can be added later as extra rules plus
# `sops updatekeys`.
creation_rules:
  - path_regex: secrets\.sops\.env$
    age: age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
