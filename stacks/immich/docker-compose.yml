# Immich, adapted from the official v3.3.5 release compose file:
# https://github.com/immich-app/immich/releases/download/v3.3.5/docker-compose.yml
#
# Deliberate differences from upstream (keep them when diffing a new release):
#   - env_file is ../../stack.env (written by Portainer at the repo root of
#     its clone; env_file paths resolve relative to THIS file) instead of .env
#   - server/ML images are pinned by tag + digest instead of ${IMMICH_VERSION},
#     so Renovate can track them (grouped into one PR; versions must match)
#   - machine learning only runs with the "ml" compose profile; set
#     COMPOSE_PROFILES=ml in the host settings to enable it
#   - DB_STORAGE_TYPE comes from the host (HDD now, SSD later)

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    volumes:
      # Do not edit the next line. Change UPLOAD_LOCATION in the host settings instead.
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # Optional external library (existing photos Immich should index but
      # never modify). Mount it read-only, then add /mnt/external/photos under
      # Administration > External Libraries:
      # - /mnt/media/photos:/mnt/external/photos:ro
    env_file:
      - ../../stack.env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    profiles: [ml]
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    volumes:
      - model-cache:/cache
    env_file:
      - ../../stack.env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # HDD or SSD: picks Postgres IO tuning for where DB_DATA_LOCATION lives.
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE}
    volumes:
      # Do not edit the next line. Change DB_DATA_LOCATION in the host settings instead.
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
